version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: adaptive-rag-redis
    restart: unless-stopped
    expose:
      - "6379"  # 仅内部网络可访问，不暴露到宿主机
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  adaptive-rag:
    build:
      context: .
      dockerfile: Dockerfile.slim
    container_name: adaptive-rag
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      # main.py CLI 运行模式（agent=AgentRuntime 单智能体 / workflow=固定 DAG）
      - ENABLE_AGENT_MODE=${ENABLE_AGENT_MODE:-agent}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"  # 仅内部网络，外部通过 Nginx 访问
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./server.py:/app/server.py
      - ./main.py:/app/main.py
      - ./config.py:/app/config.py
      - ./prompts.yaml:/app/prompts.yaml
      - ./prompt_manager.py:/app/prompt_manager.py
      - ./cache_manager.py:/app/cache_manager.py
      - ./logger.py:/app/logger.py
      - ./routers_and_graders.py:/app/routers_and_graders.py
      - ./workflow_nodes.py:/app/workflow_nodes.py
      - ./entity_extractor.py:/app/entity_extractor.py
      - ./document_processor.py:/app/document_processor.py
      # Agent 模块（单智能体运行时）
      - ./agents:/app/agents
      - ./memory:/app/memory
      - ./guardrails.py:/app/guardrails.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: adaptive-rag-nginx
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP
      # - "443:443" # HTTPS（启用后取消注释）
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./ssl:/etc/nginx/ssl:ro  # HTTPS 证书（启用后取消注释）
    depends_on:
      adaptive-rag:
        condition: service_healthy
    # 健康检查：确认 Nginx 正常响应
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  redis_data:
